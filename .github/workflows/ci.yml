name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Run V5 release gate
        run: npm run release:check
      - name: Check V5 formatting policy
        run: npm run format:check:all
      - name: Check cross-runtime golden vectors
        run: npm run test:rust
      - run: npm test
      - run: npm run trustbench:test
      - name: Run clean-environment V5 smoke
        run: npm run smoke:v5

  knolo-verify-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/knolo-verify
        with:
          cli-version: 6.2.0
          packs: conformance/packs/verified-v4.knolo

  adk-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build the local MCP server
        run: |
          npm run build --workspace @knolo/core
          npm run build --workspace @knolo/mcp
      - name: Install the Google ADK example
        run: python -m pip install -r examples/google_adk_python/requirements.txt
      - name: Search a fixture image through ADK
        run: |
          config="$(node examples/google_adk_python/prepare-fixture.mjs)"
          export KNOLO_MCP_CONFIG="$config"
          export KNOLO_MCP_COMMAND=node
          export KNOLO_MCP_ARGS="[\"${GITHUB_WORKSPACE}/packages/mcp/bin/knolo-mcp.mjs\"]"
          python examples/google_adk_python/smoke.py

  adk-js-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the local MCP server
        run: |
          npm run build --workspace @knolo/core
          npm run build --workspace @knolo/mcp
      - name: Install the Google ADK TypeScript example
        run: npm ci --prefix examples/google_adk_js --omit=dev
      - name: Search a fixture image through ADK
        run: |
          config="$(node examples/google_adk_python/prepare-fixture.mjs)"
          export KNOLO_MCP_CONFIG="$config"
          export KNOLO_MCP_COMMAND=node
          export KNOLO_MCP_ARGS="[\"${GITHUB_WORKSPACE}/packages/mcp/bin/knolo-mcp.mjs\"]"
          node --experimental-strip-types examples/google_adk_js/smoke.ts

  openai-agents-js-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the local MCP server
        run: |
          npm run build --workspace @knolo/core
          npm run build --workspace @knolo/mcp
      - name: Install the OpenAI Agents SDK example
        run: npm ci --prefix examples/openai_agents_js
      - name: Search a fixture image through the Agents SDK
        run: |
          config="$(node examples/google_adk_python/prepare-fixture.mjs)"
          export KNOLO_MCP_CONFIG="$config"
          export KNOLO_MCP_COMMAND=node
          export KNOLO_MCP_ARGS="[\"${GITHUB_WORKSPACE}/packages/mcp/bin/knolo-mcp.mjs\"]"
          node --experimental-strip-types examples/openai_agents_js/smoke.ts

  pydantic-ai-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build the local MCP server
        run: |
          npm run build --workspace @knolo/core
          npm run build --workspace @knolo/mcp
      - name: Install the Pydantic AI example
        run: python -m pip install -r examples/pydantic_ai/requirements.txt
      - name: Search a fixture image through Pydantic AI
        run: |
          config="$(node examples/google_adk_python/prepare-fixture.mjs)"
          export KNOLO_MCP_CONFIG="$config"
          export KNOLO_MCP_COMMAND=node
          export KNOLO_MCP_ARGS="[\"${GITHUB_WORKSPACE}/packages/mcp/bin/knolo-mcp.mjs\"]"
          python examples/pydantic_ai/smoke.py

  langflow-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build the local MCP server
        run: |
          npm run build --workspace @knolo/core
          npm run build --workspace @knolo/mcp
      - name: Install the Langflow example
        run: python -m pip install -r examples/langflow/requirements.txt
      - name: Search a fixture image through Langflow
        run: |
          config="$(node examples/google_adk_python/prepare-fixture.mjs)"
          export KNOLO_MCP_CONFIG="$config"
          export KNOLO_MCP_COMMAND=node
          export KNOLO_MCP_ARGS="[\"${GITHUB_WORKSPACE}/packages/mcp/bin/knolo-mcp.mjs\"]"
          python examples/langflow/smoke.py
