name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run V5 release gate
        run: npm run release:check
      - name: Check V5 formatting policy
        run: npm run format:check:all
      - name: Check cross-runtime golden vectors
        run: npm run test:rust
      - run: npm test
      - run: npm run trustbench:test
      - name: Run clean-environment V5 smoke
        run: npm run smoke:v5
